name: Notification Sw Saturday

on:
  schedule:
    # At 08:01 AM on Saturday, Moscow time (UTC+3)
    # Cron times are in UTC so adjust accordingly: 9 AM UTC+3 is 6 AM UTC
    - cron: '01 5 * * 6'
  workflow_dispatch:
      
jobs:
  notification-disc:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Send notification
      env:
        DISC: ${{ secrets.DISC }}
      run: |
        curl -F "payload_json={\"content\": \"🏊 🌊 Today 09:35 🐬 📸 Take a photo\"}" \
             $DISC
